<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>日記</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='6' width='44' height='52' rx='6' fill='%231f9e86'/%3E%3Crect x='18' y='18' width='28' height='4' rx='2' fill='white'/%3E%3Crect x='18' y='28' width='28' height='4' rx='2' fill='white'/%3E%3Crect x='18' y='38' width='18' height='4' rx='2' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: PC向け2画面。左＝検索・カレンダー・日付一覧（新しい順）、右＝その日の1ページ */
:root{
  --bg:#ffffff; --side:#f7f8f8; --fg:#0c1418; --sub:#68727a; --faint:#9ba3a8; --line:#e4e7e9;
  --accent:#1f9e86; --accent-soft:#e3f4ef; --mark:#fff1a8; --danger:#cc3d36; --btn:#0c1418; --btn-fg:#fff;
  --font:"Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121517; --side:#171b1e; --fg:#e9ecee; --sub:#a2abb1; --faint:#6f787e; --line:#272d31;
  --accent:#4cc9ae; --accent-soft:#163029; --mark:#5c5220; --danger:#ef7a73; --btn:#e9ecee; --btn-fg:#121517;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---- welcome ---- */
.welcome{height:100%;display:grid;place-items:center;padding:24px}
.welcome-box{max-width:520px}
.welcome h1{font-size:28px;margin:0 0 8px}
.welcome p{color:var(--sub);margin:0 0 16px}
.welcome ol{color:var(--sub);padding-left:1.4em;margin:0 0 24px}
.welcome ol b{color:var(--fg);font-weight:500}
.pill{border:0;border-radius:999px;padding:10px 24px;font-weight:700;background:var(--btn);color:var(--btn-fg)}
.pill:hover{opacity:.85}
.pill.line{background:none;color:var(--fg);border:1px solid var(--line);font-weight:500}
.welcome .alt{display:block;margin-top:14px;background:none;border:0;padding:0;color:var(--sub);font-size:13px;text-decoration:underline}
.warn{color:var(--danger)}

/* ---- app ---- */
.app{height:100%;display:grid;grid-template-columns:320px 1fr}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{padding:18px 18px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:20px;margin:0;font-weight:700;margin-right:auto}
.modes{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-right:auto}
.mode{border:0;background:none;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:500;color:var(--sub)}
.mode.on{background:var(--btn);color:var(--btn-fg);font-weight:700}
.newnote{width:100%;border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;font-size:13px;color:var(--sub)}
.newnote:hover{color:var(--fg);border-color:var(--sub)}
.del{color:var(--danger)}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 30px 8px 12px;font:inherit;font-size:14px}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--font);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--side)}

.cal{user-select:none}
.cal-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.cal-head button{background:none;border:0;width:28px;height:28px;border-radius:6px;color:var(--sub)}
.cal-head button:hover{background:var(--line)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.cal-grid .wd{color:var(--faint);font-size:11px;padding-bottom:2px}
.cal-grid .wd:first-child{color:var(--danger)}
.cal-day{position:relative;background:none;border:0;border-radius:6px;height:30px;padding:0;color:var(--fg)}
.cal-day:hover{background:var(--line)}
.cal-day.out{visibility:hidden}
.cal-day.future{color:var(--faint);cursor:default}
.cal-day.future:hover{background:none}
.cal-day.today{box-shadow:inset 0 0 0 1px var(--accent)}
.cal-day.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cal-day.sel{background:var(--accent);color:var(--btn-fg);font-weight:700}
.cal-day.sel::after{background:var(--btn-fg)}

.list-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 18px 6px;font-size:12px;color:var(--sub);border-top:1px solid var(--line)}
.list{flex:1;overflow-y:auto;padding:0 8px 12px;min-height:0}
.month{font-size:12px;font-weight:700;color:var(--sub);padding:12px 10px 4px}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;content-visibility:auto;contain-intrinsic-size:auto 58px}
.item:hover{background:var(--line)}
.item.sel{background:var(--accent-soft)}
.item .d{font-size:12px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}
.item .t{font-size:14px;font-weight:700;color:var(--fg);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d small{font-weight:400;color:var(--faint);margin-left:6px}
.item .ex{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
mark{background:var(--mark);color:inherit;border-radius:2px}
.list .none{padding:24px 10px;color:var(--sub);font-size:13px;text-align:center}

.side-foot{border-top:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.side-foot .folder{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{background:none;border:0;padding:2px 4px;color:var(--sub);font-size:12px;border-radius:4px;white-space:nowrap}
.linkbtn:hover{color:var(--fg);background:var(--line)}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
.page-head{display:flex;align-items:center;gap:8px;padding:16px 32px;border-bottom:1px solid var(--line)}
.page-head h2{font-size:22px;margin:0 auto 0 0;font-weight:700;font-variant-numeric:tabular-nums}
.page-head h2 small{font-size:14px;color:var(--sub);font-weight:400;margin-left:8px}
.nav{background:none;border:1px solid var(--line);border-radius:8px;height:32px;min-width:32px;padding:0 10px;font-size:13px;color:var(--sub)}
.nav:hover:not(:disabled){color:var(--fg);border-color:var(--sub)}
.nav:disabled{opacity:.4;cursor:default}.save{padding:6px 20px;font-size:13px;margin-left:8px;min-width:96px}.save.done{background:var(--accent);color:var(--btn-fg)}
.page{flex:1;overflow-y:auto;min-height:0}
.page-in{max-width:1200px;margin:0 auto;padding:32px 48px 120px}
.title-in{width:100%;border:0;background:none;color:var(--fg);font:inherit;font-size:26px;font-weight:700;line-height:1.5;padding:0;margin:0 0 20px}
.title-in:focus{outline:none}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:24px}
.ph{position:relative;margin:0;display:flex;flex-direction:column;gap:6px}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--side);cursor:zoom-in;display:block}
.ph input{width:100%;border:0;border-bottom:1px solid transparent;background:none;color:var(--sub);font:inherit;font-size:13px;line-height:1.5;padding:2px 0;text-align:center}
.ph input:hover{border-bottom-color:var(--line)}
.ph input:focus{outline:none;border-bottom-color:var(--accent);color:var(--fg)}
.ph .x{position:absolute;top:6px;right:6px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 9px;opacity:0;transition:opacity .15s}
.ph:hover .x,.ph .x:focus-visible,.ph .x.armed{opacity:1}
.ph .x.armed{background:var(--danger)}
.addph{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:8px;background:none;color:var(--faint);font-size:13px;line-height:1.6;padding:8px}
.addph:hover{color:var(--fg);border-color:var(--sub)}
.page.drop{outline:2px dashed var(--accent);outline-offset:-8px}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:6px}
.lightbox p{color:#eee;margin:0;font-size:14px}
.editor{min-height:35vh;font-size:17px;line-height:2;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;outline:none;color:var(--fg);caret-color:var(--accent)}
.editor.empty::before{content:attr(data-ph);color:var(--faint);float:left;height:0;pointer-events:none}
.inph{position:relative;display:block;margin:14px 0;user-select:none;line-height:1.5}
.inph img{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:8px;cursor:zoom-in;background:var(--side)}
.inph input{display:block;width:100%;max-width:640px;margin:6px auto 0;border:0;border-bottom:1px solid transparent;background:none;color:var(--sub);font:inherit;font-size:13px;line-height:1.5;padding:2px 0;text-align:center}
.inph input:hover{border-bottom-color:var(--line)}
.inph input:focus{outline:none;border-bottom-color:var(--accent);color:var(--fg)}
.inph .x{position:absolute;top:8px;right:8px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 9px;opacity:0;transition:opacity .15s}
.inph:hover .x,.inph .x:focus-visible,.inph .x.armed{opacity:1}
.inph .x.armed{background:var(--danger)}
.orph-head{grid-column:1/-1;font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:16px}
.ph .acts{display:flex;gap:8px;justify-content:center;font-size:12px}
.ph .acts button{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--sub)}
.ph .acts button:hover{color:var(--fg);border-color:var(--sub)}
.ph .cap{font-size:12px;color:var(--sub);text-align:center}
::placeholder{color:var(--faint)}
.status-bar{display:flex;gap:16px;align-items:center;padding:8px 32px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.status-bar .spacer{flex:1}
.status-bar .err{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--btn);color:var(--btn-fg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:20}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}
  .page-head,.page-in,.status-bar{padding-inline:16px}
}
</style>
</head>
<body>

<!-- 最初の画面 -->
<section class="welcome" id="welcome" hidden>
  <div class="welcome-box">
    <h1>日記</h1>
    <div id="wNew">
      <p>日記はあなたのPCのフォルダに保存されます。インターネット上には置かれません。</p>
      <ol>
        <li>下のボタンを押す</li>
        <li>日記を置きたい場所（デスクトップや Google Drive など）を開く</li>
        <li>「新しいフォルダー」で <b>日記</b> フォルダを作り、選んで「フォルダーの選択」</li>
        <li>「ファイルの編集を許可」で <b>変更を保存</b> を押す</li>
      </ol>
      <button class="pill" id="pickBtn" type="button">日記フォルダを選ぶ</button>
    </div>
    <div id="wResume" hidden>
      <p>前回のフォルダ「<span id="wFolder"></span>」を開きます。</p>
      <button class="pill" id="resumeBtn" type="button">日記を開く</button>
      <button class="alt" id="repickBtn" type="button">別のフォルダを選ぶ</button>
    </div>
    <p class="warn" id="wErr" hidden></p>
  </div>
</section>

<!-- 本体 -->
<div class="app" id="app" hidden>
  <aside>
    <div class="side-top">
      <div class="brand"><div class="modes" role="tablist"><button class="mode on" id="modeDiary" type="button" role="tab">日記</button><button class="mode" id="modeNote" type="button" role="tab">ノート</button></div><button class="pill line" id="todayBtn" type="button" style="padding:4px 14px;font-size:13px">今日</button></div>
      <div class="search"><input id="q" type="search" placeholder="言葉で検索" aria-label="日記を検索" autocomplete="off"><kbd>Ctrl K</kbd></div>
      <button class="newnote" id="newNoteBtn" type="button" hidden>＋ 新しいノート</button>
      <div class="cal" id="calBox">
        <div class="cal-head"><button type="button" id="calPrev" aria-label="前の月">‹</button><span id="calTitle"></span><button type="button" id="calNext" aria-label="次の月">›</button></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
    <div class="list-head"><span id="listTitle">すべての日記</span><span id="listCount"></span></div>
    <div class="list" id="list"></div>
    <div class="side-foot">
      <span class="folder" id="folderName" title="保存先フォルダ"></span>
      <button class="linkbtn" id="exportBtn" type="button">全期間を書き出す</button>
    </div>
  </aside>
  <main>
    <div class="page-head">
      <h2 id="pageDate"></h2>
      <button class="nav" id="prevDay" type="button" title="前の日（Alt+←）">‹ 前の日</button>
      <button class="nav" id="nextDay" type="button" title="次の日（Alt+→）">次の日 ›</button><button class="nav del" id="delNoteBtn" type="button" hidden>削除</button><button class="nav" id="photoBtn" type="button" title="写真を本文に入れる（Ctrl+V でも貼れる）">＋ 写真</button><button class="pill save" id="saveBtn" type="button" title="保存（Ctrl+S）">保存</button>
    </div>
    <div class="page" id="pageScroll"><div class="page-in">
      <input id="title" class="title-in" type="text" placeholder="タイトル" aria-label="タイトル" autocomplete="off">
      <div id="body" class="editor" contenteditable="plaintext-only" spellcheck="false" data-ph="今日のことを書く" role="textbox" aria-multiline="true" aria-label="本文"></div>
      <div class="gallery" id="gallery"></div>
      <input type="file" id="photoInput" accept="image/*" multiple hidden>
    </div></div>
    <div class="status-bar">
      <span id="chars">0字</span>
      <span class="spacer"></span>
      <span id="fileName"></span>
      <span id="saveState"></span>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""><p id="lbCap"></p></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const WD=["日","月","火","水","木","金","土"];
const FILE_RE=/^日記_(\d{4})\.md$/;
const HEAD_RE=/^# (\d{4})年(\d{1,2})月(\d{1,2})日(?:（[日月火水木金土]）)?[ \u3000]*(.*)$/;

let dir=null;                 // 日記フォルダ
let entries={};               // "2026-10-15" -> 本文
let titles={};                // "2026-10-15" -> タイトル
let known={};                 // ファイル名 -> 最後に読んだ/書いた lastModified
let pending=new Set();        // 未保存の日付
let backedUp=new Set();       // この起動中に予備を作ったファイル
let cur=todayKey();           // 表示中の日付
let calMonth=cur.slice(0,7);  // カレンダー表示月
let saveTimer=null, saving=null, loaded=false;
const NOTE_FILE="ノート.md";
let notes={};                 // id -> {title, body, created, updated}
let mode="diary", curNote=null;
const PHOTO_DIR="写真", CAP_FILE="説明.json";
let photos={};                // "2026-10-19" または "n:<id>" -> [ファイル名]
let captions={};              // ファイル名 -> 説明

/* ---------- 日付 ---------- */
function pad(n){return String(n).padStart(2,"0")}
function keyOf(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function todayKey(){return keyOf(new Date())}
function dateOf(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d)}
function headOf(k){const d=dateOf(k);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`}

/* ---------- ファイル形式（1年1ファイル） ---------- */
function has(k){return !!((entries[k]&&entries[k].trim())||(titles[k]&&titles[k].trim())||(photos[k]&&photos[k].length))}
function allKeys(){return [...new Set([...Object.keys(entries),...Object.keys(titles),...Object.keys(photos).filter(k=>!k.startsWith("n:"))])].filter(has).sort().reverse()}
function parseYear(text){
  const out={b:{},t:{}};let k=null,t="",buf=[];
  const commit=()=>{if(k){const b=buf.join("\n").replace(/^\s*\n/,"").replace(/\s+$/,"");if(b||t){out.b[k]=b;out.t[k]=t}}};
  for(const line of text.split(/\r?\n/)){
    const m=HEAD_RE.exec(line);
    if(m){commit();k=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;t=m[4].trim();buf=[]}
    else if(k)buf.push(line);
  }
  commit();return out;
}
function block(k){const t=(titles[k]||"").trim().replace(/\s+/g," ");return `# ${headOf(k)}${t?" "+t:""}\n\n${(entries[k]||"").replace(/\s+$/,"")}\n`}
function serializeYear(y){
  return allKeys().filter(k=>k.startsWith(y+"-")).map(block).join("\n");
}

/* ---------- ノート（ノート.md に1ファイルでまとめる） ---------- */
const NOTE_RE=/^# ノート｜(.*)$/, META_RE=/^<!-- id:(\S+) 作成:(\d{4}-\d\d-\d\d \d\d:\d\d) 更新:(\d{4}-\d\d-\d\d \d\d:\d\d) -->$/;
function stamp(d=new Date()){return `${keyOf(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function noteHas(n){return !!(n&&((n.title||"").trim()||(n.body||"").trim()||(photos["n:"+n.id]||[]).length))}
function parseNotes(text){
  const out={};let cur=null,buf=[],i=0;
  const commit=()=>{if(cur){cur.body=buf.join("\n").replace(/^\s*\n/,"").replace(/\s+$/,"");if(noteHas(cur))out[cur.id]=cur}};
  for(const line of text.split(/\r?\n/)){
    const m=NOTE_RE.exec(line);
    if(m){commit();i++;cur={id:"n-hand"+i,title:m[1].trim(),body:"",created:"",updated:""};buf=[];continue}
    if(cur&&!buf.length){const mm=META_RE.exec(line.trim());if(mm){cur.id=mm[1];cur.created=mm[2];cur.updated=mm[3];continue}}
    if(cur)buf.push(line);
  }
  commit();return out;
}
function noteIds(){return Object.keys(notes).filter(id=>noteHas(notes[id])||id===curNote).sort((a,b)=>(notes[b].updated||"9999").localeCompare(notes[a].updated||"9999"))}
function noteBlock(n){return `# ノート｜${(n.title||"").trim().replace(/\s+/g," ")}\n<!-- id:${n.id} 作成:${n.created||stamp()} 更新:${n.updated||stamp()} -->\n\n${(n.body||"").replace(/\s+$/,"")}\n`}
function serializeNotes(){return noteIds().filter(id=>noteHas(notes[id])).map(id=>noteBlock(notes[id])).join("\n")}

/* ---------- フォルダ・権限（IndexedDBにフォルダを記憶） ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("diary",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvGet(k){try{const db=await idb();return await new Promise(res=>{const r=db.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}catch(e){return null}}
async function kvSet(k,v){try{const db=await idb();await new Promise(res=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=res})}catch(e){}}

async function boot(){
  if(!("showDirectoryPicker" in window)){
    $("welcome").hidden=false;$("wNew").hidden=true;
    showErr("このブラウザでは使えません。Google Chrome か Microsoft Edge で開いてください。");return;
  }
  const h=await kvGet("dir");
  $("welcome").hidden=false;
  if(h){

async function saveYear(y,mine){
  const name=`日記_${y}.md`;
  const fh=await dir.getFileHandle(name,{create:true});
  const f=await fh.getFile();
  const old=f.size?await f.text():"";
  // 他の端末で変更されていたら、自分が触っていない日はそちらに合わせる
  if(old&&f.lastModified!==known[name]){
    const ext=parseYear(old);
    for(const k of allKeys())if(k.startsWith(y+"-")&&!mine.has(k)&&!(k in ext.b)){delete entries[k];delete titles[k]}
    for(const k in ext.b)if(!mine.has(k)){entries[k]=ext.b[k];titles[k]=ext.t[k]}
  }
  // この起動で最初の保存のとき、元の状態を backup フォルダに1つだけ残す
  if(!backedUp.has(name)){
    if(old){
      const bdir=await dir.getDirectoryHandle("backup",{create:true});
      const bw=await (await bdir.getFileHandle(name,{create:true})).createWritable();
      await bw.write(old);await bw.close();
    }
    backedUp.add(name);
  }
  const text=serializeYear(y);
  const w=await fh.createWritable();await w.write(text);await w.close();
  known[name]=(await fh.getFile()).lastModified;
  renderSide();
}
async function saveNotes(mine){

  const old=f.size?await f.text():"";
  // 他の端末で変更されていたら、自分が触っていないノートはそちらに合わせる
  if(old&&f.lastModified!==known[NOTE_FILE]){
    const ext=parseNotes(old);
    for(const id of Object.keys(notes))if(!mine.has(id)&&id!==curNote&&!(id in ext))delete notes[id];
    for(const id in ext)if(!mine.has(id))notes[id]=ext[id];
  }
  if(!backedUp.has(NOTE_FILE)){
    if(old){
      const bdir=await dir.getDirectoryHandle("backup",{create:true});
      const bw=await (await bdir.getFileHandle(NOTE_FILE,{create:true})).createWritable();
      await bw.write(old);await bw.close();
    }
    backedUp.add(NOTE_FILE);
  }
  const txt=serializeNotes();const w=await fh.createWritable();await w.write(txt);await w.close();if(!old){const bd=await dir.getDirectoryHandle("backup",{create:true});const bw2=await (await bd.getFileHandle(NOTE_FILE,{create:true})).createWritable();await bw2.write(txt);await bw2.close()}
  known[NOTE_FILE]=(await fh.getFile()).lastModified;
  renderSide();
}

}
function setBody(text){
  ed.textContent="";let buf=[];
  const flushText=()=>{if(buf.length){ed.appendChild(document.createTextNode(buf.join("\n")));buf=[]}};
  for(const line of (text||"").split("\n")){const m=IMG_LINE.exec(line.trim());if(m){flushText();ed.appendChild(makeFig(m[2],m[1]))}else buf.push(line)}
  flushText();
  if(ed.lastChild&&ed.lastChild.nodeName==="FIGURE")ed.appendChild(document.createTextNode("\u200b"));
  updateEmpty();
}
function getBody(){
  let out="",afterImg=false,started=false;
  const addText=t=>{if(!t)return;if(afterImg){out+="\n";afterImg=false}out+=t;started=true};
  const walk=node=>{
    for(const c of node.childNodes){
      if(c.nodeType===3)addText(c.nodeValue);
      else if(c.nodeName==="BR")addText("\n");
      else if(c.nodeName==="FIGURE"&&c.dataset.p){
        const cap=(c.querySelector("input")?.value||"").replace(/[\]\[\r\n]/g," ").trim();
        if(started&&!afterImg)out+="\n";if(afterImg)out+="\n";
        out+=`![${cap}](写真/${c.dataset.p})`;afterImg=true;started=true;
      }
      else if(c.nodeType===1){if(c.nodeName==="DIV"&&started)addText("\n");walk(c)}
    }
  };
  walk(ed);return out.replace(/\u200b/g,"");
}
function plainText(t){return (t||"").replace(IMG_ANY,(m,c)=>"［写真"+(c?"："+c:"")+"］")}
function updateEmpty(){ed.classList.toggle("empty",!ed.querySelector("figure")&&!(ed.textContent||"").trim())}
function grow(){updateEmpty()}
function keepCaret(){
  const s=getSelection();if(!s.rangeCount||!ed.contains(s.anchorNode))return;
  const r=s.getRangeAt(0);let rect=r.getClientRects()[0];
  if(!rect){const el=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;rect=el.getBoundingClientRect();if(el===ed)rect={bottom:Math.min(rect.bottom,innerHeight)}}
  const sc=$("pageScroll"),limit=sc.getBoundingClientRect().bottom-80;
  if(rect.bottom>limit)sc.scrollTop+=rect.bottom-limit;
}
function scrollToWord(w){
  const q=w.toLowerCase(),tw=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let n;
  while((n=tw.nextNode())){const i=n.nodeValue.toLowerCase().indexOf(q);if(i>=0){const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+w.length);const sc=$("pageScroll");sc.scrollTop+=r.getBoundingClientRect().top-sc.getBoundingClientRect().top-160;return}}
}
function insertFigAtCaret(fig){
  let r=lastRange&&ed.contains(lastRange.startContainer)?lastRange:null;
  if(!r){r=document.createRange();r.selectNodeContents(ed);r.collapse(false)}
  r.deleteContents();r.insertNode(fig);
  // 写真が末尾なら、その後ろに書き続けられるよう見えない文字を置く
  let nx=fig.nextSibling;
  while(nx&&nx.nodeType===3&&nx.nodeValue===""&&nx.nextSibling){const t=nx.nextSibling;nx.remove();nx=t}
  if(!nx||nx.nodeName==="FIGURE")fig.after(document.createTextNode("\u200b"));
  else if(nx.nodeType===3&&nx.nodeValue==="")nx.nodeValue="\u200b";
  const after=document.createRange();
  if(fig.nextSibling&&fig.nextSibling.nodeType===3){after.setStart(fig.nextSibling,fig.nextSibling.nodeValue.startsWith("\u200b")?1:0)}else after.setStartAfter(fig);
  after.collapse(true);lastRange=after;
  // カーソルを写真の直後に移して、そのまま書き続けられるようにする
  if(document.activeElement===ed||ed.contains(document.activeElement)){const sel=getSelection();sel.removeAllRanges();sel.addRange(after.cloneRange())}
  updateEmpty();
}
document.addEventListener("selectionchange",()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode)&&!s.anchorNode.closest?.("figure")&&!(s.anchorNode.parentElement&&s.anchorNode.parentElement.closest("figure")))lastRange=s.getRangeAt(0).cloneRange()});
function updateCount(){$("chars").textContent=`${[...getBody().replace(IMG_ANY,"").replace(/\s/g,"")].length.toLocaleString()}字`}
let figCount=0;
function onEdit(){
  const v=getBody();
  if(mode==="note"){if(!notes[curNote])return;notes[curNote].body=v;touchNote()}else{entries[cur]=v;pending.add(cur)}
  updateEmpty();updateCount();schedule();renderSideSoon();
  const fc=ed.querySelectorAll("figure.inph").length;if(fc!==figCount){figCount=fc;renderGallery()}
}
function touchNote(){const n=notes[curNote];n.updated=stamp();if(!n.created)n.created=n.updated;pending.add("n:"+curNote);noteHead()}
ed.addEventListener("input",e=>{
  if(e.target.tagName==="INPUT"){const f=e.target.closest("figure");if(f)f.querySelector("img").alt=e.target.value||"写真"}
  onEdit();if(e.target===ed)keepCaret();
});
ed.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"){e.stopPropagation();if(e.key==="Enter"&&!e.isComposing){e.preventDefault();e.target.blur()}}});
ed.addEventListener("click",e=>{
  const f=e.target.closest("figure.inph");if(!f)return;
  if(e.target.classList.contains("x")){
    const x=e.target;if(!x.classList.contains("armed")){x.classList.add("armed");x.textContent="もう一度で削除";setTimeout(()=>{x.classList.remove("armed");x.textContent="削除"},3000);return}
    return deletePhoto(f.dataset.p);
  }
  if(e.target.tagName==="IMG"&&e.target.src){$("lbImg").src=e.target.src;$("lbCap").textContent=f.querySelector("input").value||"";$("lightbox").hidden=false}
});
$("title").addEventListener("input",()=>{
  if(mode==="note"){if(!notes[curNote])return;notes[curNote].title=$("title").value;touchNote();schedule();renderSideSoon();return}
  titles[cur]=$("title").value;pending.add(cur);schedule();renderSideSoon();
});
$("title").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();ed.focus();const r=document.createRange();r.setStart(ed,0);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}});
$("prevDay").onclick=()=>openDay(addDays(cur,-1));
$("nextDay").onclick=()=>openDay(addDays(cur,1));
$("todayBtn").onclick=()=>openDay(todayKey());

/* ---------- 画面：左（カレンダー・一覧・検索） ---------- */
let sideTimer=null;
function renderSideSoon(){clearTimeout(sideTimer);sideTimer=setTimeout(renderSide,400)}
function renderSide(){if(mode==="diary")renderCal();renderList()}
function renderCal(){
  const [y,m]=calMonth.split("-").map(Number);
  $("calTitle").textContent=`${y}年${m}月`;
  const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),tk=todayKey();
  let h=WD.map(w=>`<span class="wd">${w}</span>`).join("");
  for(let i=0;i<first.getDay();i++)h+=`<span class="cal-day out"></span>`;
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(m)}-${pad(d)}`;
    const cls=["cal-day"];
    if(has(k))cls.push("has");
    if(k===tk)cls.push("today");
    if(k===cur)cls.push("sel");
    if(k>tk)cls.push("future");
    h+=`<button type="button" class="${cls.join(" ")}" data-k="${k}"${k>tk?" tabindex=\"-1\" aria-disabled=\"true\"":""}>${d}</button>`;
  }
  $("calGrid").innerHTML=h;
  $("calNext").disabled=calMonth>=tk.slice(0,7);
}
function shiftMonth(n){const [y,m]=calMonth.split("-").map(Number);const d=new Date(y,m-1+n,1);calMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;renderCal()}
$("calPrev").onclick=()=>shiftMonth(-1);$("calNext").onclick=()=>shiftMonth(1);
$("calGrid").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b&&!b.classList.contains("future"))openDay(b.dataset.k)});

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function mark(t,q){const i=q?t.toLowerCase().indexOf(q.toLowerCase()):-1;return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))}
function snippet(text,q){
  const flat=plainText(text).replace(/\s+/g," ");
  if(!q)return esc(flat.slice(0,80));
  const i=flat.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(flat.slice(0,80));
  const s=Math.max(0,i-20),part=flat.slice(s,s+90);
  const j=i-s;
  return (s?"…":"")+esc(part.slice(0,j))+"<mark>"+esc(part.slice(j,j+q.length))+"</mark>"+esc(part.slice(j+q.length));
}
function renderNoteList(q){
  let ids=noteIds();
  if(q)ids=ids.filter(id=>((notes[id].title||"")+"\n"+(notes[id].body||"")).toLowerCase().includes(q.toLowerCase()));
  $("listTitle").textContent=q?`「${q}」の検索結果`:"すべてのノート";
  $("listCount").textContent=`${ids.filter(id=>noteHas(notes[id])).length}件`;
  if(!ids.length){$("list").innerHTML=`<div class="none">${q?"見つかりませんでした":"まだノートはありません。<br>「＋ 新しいノート」から作れます。"}</div>`;return}
  $("list").innerHTML=ids.map(id=>{const n=notes[id];return `<button type="button" class="item${id===curNote?" sel":""}" data-n="${esc(id)}"><div class="d">${n.updated?fmtStamp(n.updated):"未保存"}</div><div class="t">${n.title&&n.title.trim()?mark(n.title,q):"無題のノート"}</div><div class="ex">${snippet(n.body||"",q)}</div></button>`}).join("");
}
function renderList(){
  const q=$("q").value.trim();
  if(mode==="note")return renderNoteList(q);
  let keys=allKeys();
  if(q)keys=keys.filter(k=>((titles[k]||"")+"\n"+(entries[k]||"")).toLowerCase().includes(q.toLowerCase()));
  $("listTitle").textContent=q?`「${q}」の検索結果`:"すべての日記";
  $("listCount").textContent=`${keys.length}日`;
  if(!keys.length){$("list").innerHTML=`<div class="none">${q?"見つかりませんでした":"まだ日記はありません。<br>右側に書くと自動で保存されます。"}</div>`;return}
  let h="",lastM="";
  for(const k of keys){
    const d=dateOf(k),mk=k.slice(0,7);
    if(mk!==lastM){h+=`<div class="month">${d.getFullYear()}年${d.getMonth()+1}月</div>`;lastM=mk}
    h+=`<button type="button" class="item${k===cur?" sel":""}" data-k="${k}"><div class="d">${d.getMonth()+1}月${d.getDate()}日<small>${WD[d.getDay()]}曜日${photos[k]?" ・写真"+photos[k].length:""}</small></div>${titles[k]&&titles[k].trim()?`<div class="t">${mark(titles[k],q)}</div>`:""}<div class="ex">${snippet(entries[k]||"",q)}</div></button>`;
  }
  $("list").innerHTML=h;
}
$("list").addEventListener("click",e=>{const q=$("q").value.trim()||null;const n=e.target.closest("[data-n]");if(n)return openNote(n.dataset.n,q);const b=e.target.closest("[data-k]");if(b)openDay(b.dataset.k,q)});
let qTimer=null;
$("q").addEventListener("input",()=>{clearTimeout(qTimer);qTimer=setTimeout(renderList,150)});
$("q").addEventListener("keydown",e=>{
  if(e.key==="Escape"){$("q").value="";renderList();$("body").focus()}
  if(e.key==="Enter"){const b=$("list").querySelector(".item");if(b)b.click()}
});

/* ---------- 全期間の書き出し ---------- */
$("exportBtn").onclick=async()=>{
  await flush();
  const keys=allKeys(),nids=noteIds().filter(id=>noteHas(notes[id]));
  if(!keys.length&&!nids.length)return toast("書き出す日記がまだありません");
  const text=keys.map(block).join("\n")+(nids.length?"\n---\n\n"+nids.map(id=>noteBlock(notes[id])).join("\n"):"");
  try{
    const h=await showSaveFilePicker({suggestedName:`日記_全期間_${todayKey().replace(/-/g,"")}.md`,startIn:"documents",types:[{description:"テキスト（Markdown）",accept:{"text/markdown":[".md"]}}]});
    const w=await h.createWritable();await w.write(text);await w.close();
    toast(`日記${keys.length}日分${nids.length?"・ノート"+nids.length+"件":""}を書き出しました`);
  }catch(e){if(e.name!=="AbortError")toast("書き出せませんでした："+e.message)}
};

/* ---------- キー操作 ---------- */
document.addEventListener("keydown",e=>{
  if($("app").hidden)return;
  if(e.key==="Escape"&&!$("lightbox").hidden){$("lightbox").hidden=true;return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();manualSave()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("q").focus();$("q").select()}
  if(mode==="diary"&&e.altKey&&e.key==="ArrowLeft"){e.preventDefault();openDay(addDays(cur,-1))}
  if(mode==="diary"&&e.altKey&&e.key==="ArrowRight"&&cur<todayKey()){e.preventDefault();openDay(addDays(cur,1))}
});
// 日付が変わったら「今日」を更新
setInterval(()=>{if(!$("app").hidden&&mode==="diary")renderCal()},60000);

let toastTimer=null;
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3000)}

boot();
</script>
</body>
